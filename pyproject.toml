[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llmsentinel"
version = "3.0.0"
description = "A deterministic security control plane for local and hosted AI applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LLMSentinel contributors" }]
dependencies = [
  "fastapi>=0.162.5,<1",
  "uvicorn[standard]>=0.27,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "rfc8785>=0.1.4,<0.2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8", "types-PyYAML>=6.0"]
enterprise = ["PyJWT[crypto]>=2.10,<3", "chromadb>=1.0,<2", "redis>=5,<7"]
observability = ["opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2", "opentelemetry-exporter-otlp-proto-http>=1.28,<2"]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"sentinel/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
