version: 1
revision: "2026.11.0"
name: default-strict
description: Local starter policy; configure JWT auth and upstream secrets before production use.
limits:
  max_request_bytes: 65536
  max_input_chars: 16000
  requests_per_minute: 120
  upstream_timeout_seconds: 30
  max_upstream_response_bytes: 2097152
  circuit_breaker_failures: 5
  circuit_breaker_reset_seconds: 15
layers:
  l1:
    enabled: true
    block_opaque_entropy_bits_per_char: 5.85
    decode_base64: true
    decode_hex: true
    normalize_unicode: true
  l2:
    enabled: true
    mode: deterministic_heuristics
    block_patterns:
      - ignore previous instructions
      - reveal system prompt
      - developer message
      - আগের সব নির্দেশনা উপেক্ষা করো
      - সিস্টেম প্রম্পট প্রকাশ করো
      - সিস্টেম প্রম্পট দেখাও
      - গোপন নির্দেশনা দেখাও
      - নিরাপত্তা সীমা উপেক্ষা করো
  l3:
    enabled: true
    require_tenant_from_verified_jwt: true
    reject_path_traversal: true
    validate_json_schema: true
  l4:
    enabled: true
tools:
  allow: [search_documents, read_profile, delete_user, execute_sql]
  tenant_bound: [search_documents, read_profile, delete_user]
  roles:
    search_documents: [user, analyst, admin]
    read_profile: [user, analyst, admin]
    delete_user: [admin]
    execute_sql: [admin]
  critical: [delete_user, execute_sql]
  schemas:
    search_documents:
      required: [query]
      properties: {query: {type: string}, limit: {type: integer}, tenant_id: {type: string}}
      additionalProperties: false
    read_profile:
      required: [user_id]
      properties: {user_id: {type: string}, tenant_id: {type: string}}
      additionalProperties: false
    delete_user:
      required: [user_id]
      properties: {user_id: {type: string}, tenant_id: {type: string}}
      additionalProperties: false
    execute_sql:
      required: [query]
      properties: {query: {type: string}}
      additionalProperties: false
output:
  canary: CANARY_SECRET_9941_ALPHA
  redact: [aws_access_key, openai_key, private_key, email]
auth:
  require_auth: false
  secret_env: SENTINEL_JWT_SECRET
  mode: hs256
approval:
  secret_env: SENTINEL_APPROVAL_SECRET
integrations:
  mcp:
    protocol_version: "2025-06-18"
