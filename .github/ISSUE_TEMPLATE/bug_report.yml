name: Bug report
description: Report a reproducible defect in LLMSentinel.
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting channel in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the smallest reproducible description.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LLMSentinel version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and steps to reproduce
    validations:
      required: true
