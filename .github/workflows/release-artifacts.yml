name: Release artifacts

on:
  workflow_call:

permissions: {}

jobs:
  python-distributions:
    name: Build, attest, and release Python distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build source and wheel distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
      - name: Generate signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi

  container-images:
    name: Publish attested gateway and dashboard images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Validate release tag and image names
        id: image-names
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Release tags must use a semantic version such as v3.0.0" >&2
            exit 1
          fi
          repository="${REPOSITORY,,}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "gateway=ghcr.io/${repository}-gateway" >> "$GITHUB_OUTPUT"
          echo "dashboard=ghcr.io/${repository}-dashboard" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push gateway image
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image-names.outputs.gateway }}:${{ steps.image-names.outputs.tag }}
          sbom: true
          provenance: mode=max
      - name: Attest gateway image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image-names.outputs.gateway }}
          subject-digest: ${{ steps.gateway.outputs.digest }}
          push-to-registry: true
      - name: Build and push dashboard image
        id: dashboard
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ steps.image-names.outputs.dashboard }}:${{ steps.image-names.outputs.tag }}
          sbom: true
          provenance: mode=max
      - name: Attest dashboard image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image-names.outputs.dashboard }}
          subject-digest: ${{ steps.dashboard.outputs.digest }}
          push-to-registry: true
